# Netlify deployment configuration for the PK Sompura front end.
# Base directory must be set to "frontend" in the Netlify site settings.

[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

# --- Proxy the API through this origin -------------------------------------
# Rewriting to the backend rather than calling it cross-origin means the
# browser never makes a CORS preflight, and the admin panel's session cookie
# stays same-origin. Update the host below to your deployed Render URL.
#
# These MUST come before the SPA catch-all: Netlify applies the first match.

[[redirects]]
  from = "/api/*"
  to = "https://pk-sompura-api.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/admin/*"
  to = "https://pk-sompura-api.onrender.com/admin/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/admin"
  to = "https://pk-sompura-api.onrender.com/admin"
  status = 200
  force = true

# --- SPA fallback (must be last) -------------------------------------------
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# --- Security headers ------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# Hashed filenames, so they can be cached permanently.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The entry point must never be cached, or a deploy will not be picked up.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

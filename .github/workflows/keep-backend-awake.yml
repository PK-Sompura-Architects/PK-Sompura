name: Keep Render services awake

# Render's free tier stops a web service after 15 minutes without traffic, and
# the next visitor waits roughly 50 seconds while it restarts. A request every
# 10 minutes keeps it running.
#
# Window: 10:00-19:00 IST (04:30-13:30 UTC), deliberately not around the clock.
# The 750 free instance hours are pooled across the whole workspace, not per
# service. Two services kept awake 9 hours a day costs about 560 hours a month,
# which leaves real headroom; keeping both up 24/7 would need about 1,460 and
# Render would suspend them both partway through the month.
#
# Set the repository variable KEEPALIVE_URLS (Settings > Secrets and variables
# > Actions > Variables) to a comma-separated list of service URLs, e.g.
#   https://pk-sompura-api.onrender.com,https://the-privacy-toolkit.onrender.com
#
# GitHub does not promise punctual schedules -- runs are queued and can be late
# under load, so a service may still nap occasionally. For a firm guarantee
# point an external monitor (cron-job.org, UptimeRobot) at the same URLs
# instead, and unset the variable here so the hours are not spent twice.
on:
  schedule:
    - cron: "30,40,50 4 * * *"      # 10:00-10:20 IST
    - cron: "*/10 5-12 * * *"       # 10:30-18:20 IST
    - cron: "0,10,20,30 13 * * *"   # 18:30-19:00 IST
  workflow_dispatch:

concurrency:
  group: keep-render-awake
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Ping each service
        env:
          KEEPALIVE_URLS: ${{ vars.KEEPALIVE_URLS }}
          RENDER_URL: ${{ vars.RENDER_URL }}
        run: |
          urls="${KEEPALIVE_URLS:-$RENDER_URL}"
          if [ -z "$urls" ]; then
            echo "Neither KEEPALIVE_URLS nor RENDER_URL is set; nothing to ping."
            exit 0
          fi

          failed=0
          echo "$urls" | tr ',' '\n' | while read -r url; do
            url="$(echo "$url" | xargs)"          # trim surrounding spaces
            [ -z "$url" ] && continue
            # A cold start can take ~50s, so allow well past that before failing.
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 90 \
                   --retry 2 --retry-delay 10 "${url%/}/" || echo 000)
            echo "${url%/}/ -> $code"
            case "$code" in
              2*|3*) ;;
              *) echo "::warning::${url%/} returned $code" ;;
            esac
          done

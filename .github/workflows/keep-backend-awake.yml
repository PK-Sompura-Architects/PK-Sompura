name: Keep Render backend awake

# Render's free tier stops a web service after 15 minutes without traffic, and
# the next visitor waits roughly 50 seconds for it to start again. A request
# every 10 minutes keeps it running.
#
# Deliberately NOT 24/7. A free service gets 750 instance hours a month and
# running non-stop uses about 730 of them, leaving no room for a second free
# service and no margin at all. This window is 05:00-23:00 IST, which covers
# every hour a visitor in India realistically arrives and costs about 580
# hours a month.
#
# Set the repository variable RENDER_URL (Settings > Secrets and variables >
# Actions > Variables) to the service URL, e.g. https://pk-sompura-api.onrender.com
#
# GitHub does not promise punctual schedules -- runs are queued and can be
# late under load, so the service may still nap occasionally. If that is not
# good enough, point an external uptime monitor at the same URL; see
# DEPLOYMENT.md.
on:
  schedule:
    - cron: "*/10 0-17 * * *"   # 05:30-23:00 IST
    - cron: "*/10 23 * * *"     # 04:30-05:00 IST
  workflow_dispatch:

# A late run should not pile up behind the previous one.
concurrency:
  group: keep-backend-awake
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the health endpoint
        env:
          RENDER_URL: ${{ vars.RENDER_URL }}
        run: |
          if [ -z "$RENDER_URL" ]; then
            echo "RENDER_URL repository variable is not set; nothing to ping."
            exit 0
          fi
          # A cold start can take ~50s, so allow well past that before failing.
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 90 \
                 --retry 2 --retry-delay 10 "$RENDER_URL/")
          echo "$RENDER_URL/ -> $code"
          [ "$code" = "200" ] || exit 1

<!doctype html>
<!-- Poster generator for the phase-2 stand-in posters (Board 05, Relief Poster / Mountain Poster).
     ?mode=hero|toolpath|mountain&stage=1..4. Rendered to images by tools/posters/render.py.
     Replaced in phase 5 by renders from the real three.js scenes with the same camera. -->
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
  #root { position: relative; width: 100%; height: 100%; container-type: size; overflow: hidden; }
  .a { position: absolute; }
</style>
<div id="root"></div>
<script>
const q = new URLSearchParams(location.search);
const mode = q.get('mode') || 'hero';
const T = '../../public/tex/';
const root = document.getElementById('root');

function relief(toolpath) {
  root.style.background = `#E7DFD2 url(${T}stone.webp)`;
  const dent = Array.from({ length: 11 }, () => '<div style="width:2.6cqh;height:2.6cqh;background:#E7DFD2"></div>').join('');
  const bosses = Array.from({ length: 12 }, (_, i) => `<div class="a" style="left:-0.8cqh;top:-0.8cqh;width:1.6cqh;height:1.6cqh;border-radius:50%;background:#E7DFD2;transform:rotate(${i * 30}deg) translateY(-14.2cqh)"></div>`).join('');
  const petals = Array.from({ length: 8 }, (_, i) => `<div class="a" style="left:-2.35cqh;top:-2.35cqh;width:4.7cqh;height:4.7cqh;background:#E7DFD2;transform:rotate(${i * 45}deg) translateY(-27.7cqh) rotate(45deg)"></div>`).join('');
  root.innerHTML = `
  <div class="a" style="left:50%;top:50%;width:70.4cqh;height:88cqh;transform:translate(-50%,-50%)">
    <div class="a" style="inset:3.3cqh;box-shadow:0.7cqh 1cqh 1.6cqh rgba(38,38,84,.30),-0.2cqh -0.2cqh 0 rgba(244,239,230,.55)"></div>
    <div class="a" style="inset:5.6cqh;background:#E7DFD2 url(${T}stone.webp);box-shadow:inset 0.7cqh 1cqh 1.4cqh rgba(38,38,84,.36),inset -0.2cqh -0.2cqh 0 rgba(244,239,230,.5)"></div>
    <div class="a" style="left:9cqh;right:9cqh;top:8cqh;display:flex;justify-content:space-between;filter:drop-shadow(0.35cqh 0.5cqh 0.4cqh rgba(38,38,84,.4))">${dent}</div>
    <div class="a" style="left:9cqh;right:9cqh;bottom:8cqh;display:flex;justify-content:space-between;filter:drop-shadow(0.35cqh 0.5cqh 0.4cqh rgba(38,38,84,.4))">${dent}</div>
    <div class="a" style="left:9cqh;top:14cqh;bottom:14cqh;width:3.4cqh;box-shadow:inset 0.5cqh 0.8cqh 1cqh rgba(38,38,84,.38),inset -0.2cqh -0.2cqh 0 rgba(244,239,230,.5)"></div>
    <div class="a" style="right:9cqh;top:14cqh;bottom:14cqh;width:3.4cqh;box-shadow:inset 0.5cqh 0.8cqh 1cqh rgba(38,38,84,.38),inset -0.2cqh -0.2cqh 0 rgba(244,239,230,.5)"></div>
    <div class="a" style="left:50%;top:50%;width:0;height:0">
      <div class="a" style="left:-21.1cqh;top:-21.1cqh;width:42.2cqh;height:42.2cqh;border-radius:50%;background:#E7DFD2 url(${T}stone.webp);box-shadow:0.9cqh 1.4cqh 2.4cqh rgba(38,38,84,.38),-0.25cqh -0.25cqh 0 rgba(244,239,230,.6)"></div>
      <div class="a" style="left:-16.5cqh;top:-16.5cqh;width:33cqh;height:33cqh;border-radius:50%;box-shadow:inset 0.7cqh 1.1cqh 1.6cqh rgba(38,38,84,.42),inset -0.2cqh -0.2cqh 0 rgba(244,239,230,.5)"></div>
      <div class="a" style="left:0;top:0;width:0;height:0;filter:drop-shadow(0.3cqh 0.45cqh 0.35cqh rgba(38,38,84,.45))">${bosses}</div>
      <div class="a" style="left:-11.75cqh;top:-11.75cqh;width:23.5cqh;height:23.5cqh;border-radius:50%;background:#E7DFD2 url(${T}stone.webp);box-shadow:0.6cqh 1cqh 1.6cqh rgba(38,38,84,.40),-0.2cqh -0.2cqh 0 rgba(244,239,230,.6)"></div>
      <div class="a" style="left:-7cqh;top:-7cqh;width:14cqh;height:14cqh;border-radius:50%;box-shadow:inset 0.5cqh 0.8cqh 1.2cqh rgba(38,38,84,.45),inset -0.2cqh -0.2cqh 0 rgba(244,239,230,.5)"></div>
      <div class="a" style="left:-3.3cqh;top:-3.3cqh;width:6.6cqh;height:6.6cqh;border-radius:50%;background:#E7DFD2 url(${T}stone.webp);box-shadow:0.4cqh 0.6cqh 0.9cqh rgba(38,38,84,.45),-0.15cqh -0.15cqh 0 rgba(244,239,230,.6)"></div>
      <div class="a" style="left:0;top:0;width:0;height:0;filter:drop-shadow(0.5cqh 0.8cqh 0.6cqh rgba(38,38,84,.42))">${petals}</div>
    </div>
  </div>
  ${toolpath ? `
    <div class="a" style="top:0;bottom:0;left:56%;right:0;background:repeating-linear-gradient(0deg,rgba(82,96,107,0) 0 6px,rgba(82,96,107,.16) 6px 7px),#E7DFD2 url(${T}stone.webp)"></div>
    <div class="a" style="top:0;bottom:0;left:56%;width:2px;margin-left:-1px;background:#CD8841;box-shadow:0 0 14px 3px rgba(205,136,65,.55)"></div>
    <div class="a" style="left:56%;top:38%;width:3cqh;height:3cqh;margin-left:-1.5cqh;margin-top:-1.5cqh;border-radius:50%;border:2px solid #CD8841;box-shadow:0 0 18px 4px rgba(205,136,65,.45)"></div>` : ''}
  <div class="a" style="inset:0;background:linear-gradient(118deg,rgba(244,239,230,.38) 0%,rgba(244,239,230,0) 34%,rgba(14,14,31,0) 55%,rgba(14,14,31,.42) 100%)"></div>`;
}

function mountain(stage) {
  const c = { 1: [0, .18, 0, .08, 0, .5], 2: [7, .55, .45, .25, .75, .8], 3: [29, 1, 1, .38, 1, 0], 4: [33, .8, .6, .3, 1, 0] }[stage];
  const [offset, glow, rays, rim, temple, seam] = c;
  const spire = (side, lg) => `clip-path:polygon(50% 0,58% 8%,66% 26%,76% 52%,86% 78%,92% 100%,8% 100%,14% 78%,24% 52%,34% 26%,42% 8%);background:repeating-linear-gradient(0deg,rgba(38,38,84,0) 0 1.4cqh,rgba(38,38,84,.16) 1.4cqh 1.6cqh),${lg}`;
  const L = 'polygon(0 100%,0 58%,14% 50%,26% 54%,40% 34%,52% 38%,66% 16%,78% 20%,90% 6%,100% 10%,100% 100%)';
  const R = 'polygon(100% 100%,100% 58%,86% 50%,74% 54%,60% 34%,48% 38%,34% 16%,22% 20%,10% 6%,0 10%,0 100%)';
  root.style.background = '#0E0E1F';
  root.innerHTML = `
  <div class="a" style="inset:0;background:repeating-radial-gradient(ellipse 120% 90% at 50% 92%,rgba(121,138,150,0) 0 24px,rgba(121,138,150,.22) 24px 25px)"></div>
  <div class="a" style="inset:0;background:radial-gradient(circle at 50% 62%,rgba(205,136,65,.55) 0,rgba(205,136,65,.12) 22%,rgba(205,136,65,0) 42%);opacity:${glow}"></div>
  <div class="a" style="inset:0;opacity:${rays};background:repeating-conic-gradient(from 0deg at 50% 58%,rgba(205,136,65,.22) 0deg 2deg,rgba(205,136,65,0) 2deg 8deg);-webkit-mask-image:radial-gradient(circle at 50% 58%,#000 0,rgba(0,0,0,.5) 25%,transparent 55%);mask-image:radial-gradient(circle at 50% 58%,#000 0,rgba(0,0,0,.5) 25%,transparent 55%)"></div>
  <div class="a" style="left:50%;bottom:8cqh;width:30cqh;height:54cqh;margin-left:-15cqh;opacity:${temple}">
    <div class="a" style="left:3cqh;bottom:14.5cqh;width:6cqh;height:13cqh;${spire('l', 'linear-gradient(90deg,#CD8841 0%,#F4EFE6 30%,#E7DFD2 80%,#CD8841 100%)')}"></div>
    <div class="a" style="right:3cqh;bottom:14.5cqh;width:6cqh;height:13cqh;${spire('r', 'linear-gradient(90deg,#CD8841 0%,#E7DFD2 20%,#F4EFE6 70%,#CD8841 100%)')}"></div>
    <div class="a" style="left:7.5cqh;bottom:14.5cqh;width:15cqh;height:30cqh;clip-path:polygon(50% 0,57% 5%,63% 18%,70% 40%,78% 66%,86% 88%,90% 100%,10% 100%,14% 88%,22% 66%,30% 40%,37% 18%,43% 5%);background:repeating-linear-gradient(0deg,rgba(38,38,84,0) 0 1.6cqh,rgba(38,38,84,.16) 1.6cqh 1.8cqh),linear-gradient(90deg,#CD8841 0%,#F4EFE6 24%,#F4EFE6 52%,#E7DFD2 76%,#CD8841 100%)"></div>
    <div class="a" style="left:12.3cqh;bottom:44cqh;width:5.4cqh;height:1.8cqh;border-radius:50%;background:linear-gradient(90deg,#CD8841,#F4EFE6 40%,#E7DFD2)"></div>
    <div class="a" style="left:14.2cqh;bottom:45.6cqh;width:1.6cqh;height:2.4cqh;border-radius:50% 50% 40% 40%;background:#CD8841"></div>
    <div class="a" style="left:14.9cqh;bottom:47.5cqh;width:2px;height:6.5cqh;background:#E7DFD2"></div>
    <div class="a" style="left:15.1cqh;bottom:51.2cqh;width:3.4cqh;height:2.6cqh;clip-path:polygon(0 0,100% 50%,0 100%);background:#CD8841"></div>
    <div class="a" style="left:5cqh;bottom:3.5cqh;width:20cqh;height:11cqh;background:repeating-linear-gradient(90deg,rgba(38,38,84,0) 0 2.3cqh,rgba(38,38,84,.14) 2.3cqh 2.5cqh),linear-gradient(90deg,#CD8841 0%,#F4EFE6 22%,#E7DFD2 80%,#CD8841 100%)"></div>
    <div class="a" style="left:13.25cqh;bottom:3.5cqh;width:3.5cqh;height:6.5cqh;border-radius:1.75cqh 1.75cqh 0 0;background:radial-gradient(circle at 50% 80%,#F4EFE6 0,#CD8841 45%,#262654 100%)"></div>
    <div class="a" style="left:0;bottom:0;width:30cqh;height:3.5cqh;background:linear-gradient(#F4EFE6,#E7DFD2);box-shadow:0 1.5cqh 3cqh rgba(205,136,65,.35)"></div>
  </div>
  <div class="a" style="left:0;bottom:0;width:50.5cqw;height:84cqh;transform:translateX(-${offset}cqw)">
    <div class="a" style="inset:0;clip-path:${L};background:linear-gradient(90deg,#0E0E1F 0%,#262654 70%,#52606B 100%)"></div>
    <div class="a" style="inset:0;clip-path:polygon(40% 34%,52% 38%,66% 16%,78% 20%,90% 6%,100% 10%,100% 100%,62% 100%);background:linear-gradient(90deg,rgba(121,138,150,0) 20%,rgba(121,138,150,.32) 100%)"></div>
    <div class="a" style="inset:0;clip-path:polygon(90% 6%,100% 10%,100% 100%,95% 100%,97% 60%,93% 30%);background:linear-gradient(90deg,rgba(205,136,65,0),rgba(205,136,65,${rim}))"></div>
    <div class="a" style="inset:0;clip-path:${L};background:repeating-linear-gradient(170deg,rgba(14,14,31,0) 0 3cqh,rgba(14,14,31,.25) 3cqh 3.2cqh)"></div>
  </div>
  <div class="a" style="right:0;bottom:0;width:50.5cqw;height:84cqh;transform:translateX(${offset}cqw)">
    <div class="a" style="inset:0;clip-path:${R};background:linear-gradient(270deg,#0E0E1F 0%,#262654 70%,#52606B 100%)"></div>
    <div class="a" style="inset:0;clip-path:polygon(60% 34%,48% 38%,34% 16%,22% 20%,10% 6%,0 10%,0 100%,38% 100%);background:linear-gradient(270deg,rgba(121,138,150,0) 20%,rgba(121,138,150,.26) 100%)"></div>
    <div class="a" style="inset:0;clip-path:polygon(10% 6%,0 10%,0 100%,5% 100%,3% 60%,7% 30%);background:linear-gradient(270deg,rgba(205,136,65,0),rgba(205,136,65,${rim}))"></div>
    <div class="a" style="inset:0;clip-path:${R};background:repeating-linear-gradient(10deg,rgba(14,14,31,0) 0 3cqh,rgba(14,14,31,.25) 3cqh 3.2cqh)"></div>
  </div>
  ${seam ? `<div class="a" style="left:50%;bottom:0;height:76cqh;width:2px;margin-left:-1px;background:linear-gradient(rgba(205,136,65,0),#CD8841 30%,#CD8841);box-shadow:0 0 18px 4px rgba(205,136,65,${seam})"></div>` : ''}
  <div class="a" style="left:0;right:0;top:0;height:12cqh;background:linear-gradient(#0E0E1F,rgba(14,14,31,0))"></div>
  <div class="a" style="left:0;right:0;bottom:0;height:10cqh;background:linear-gradient(rgba(14,14,31,0),#0E0E1F)"></div>
  <div class="a" style="inset:0;background:url(${T}grain-night.webp)"></div>`;
}

if (mode === 'mountain') mountain(Number(q.get('stage') || 3));
else relief(mode === 'toolpath');
</script>

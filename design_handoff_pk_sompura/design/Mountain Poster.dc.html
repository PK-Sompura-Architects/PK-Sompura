<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="position:relative;width:100%;height:100%;container-type:size;overflow:hidden;background:#0E0E1F">
  <div style="position:absolute;inset:0;background:repeating-radial-gradient(ellipse 120% 90% at 50% 92%,rgba(121,138,150,0) 0 24px,rgba(121,138,150,.22) 24px 25px)"></div>
  <div style="position:absolute;inset:0;background:radial-gradient(circle at 50% 62%,rgba(205,136,65,.55) 0,rgba(205,136,65,.12) 22%,rgba(205,136,65,0) 42%);opacity:{{ glow }}"></div>
  <div style="position:absolute;inset:0;opacity:{{ rays }};background:repeating-conic-gradient(from 0deg at 50% 58%,rgba(205,136,65,.22) 0deg 2deg,rgba(205,136,65,0) 2deg 8deg);-webkit-mask-image:radial-gradient(circle at 50% 58%,#000 0,rgba(0,0,0,.5) 25%,transparent 55%);mask-image:radial-gradient(circle at 50% 58%,#000 0,rgba(0,0,0,.5) 25%,transparent 55%)"></div>
  <div style="position:absolute;left:50%;bottom:8cqh;width:30cqh;height:54cqh;margin-left:-15cqh;opacity:{{ templeOpacity }}">
    <div style="position:absolute;left:3cqh;bottom:14.5cqh;width:6cqh;height:13cqh;clip-path:polygon(50% 0,58% 8%,66% 26%,76% 52%,86% 78%,92% 100%,8% 100%,14% 78%,24% 52%,34% 26%,42% 8%);background:repeating-linear-gradient(0deg,rgba(38,38,84,0) 0 1.4cqh,rgba(38,38,84,.16) 1.4cqh 1.6cqh),linear-gradient(90deg,#CD8841 0%,#F4EFE6 30%,#E7DFD2 80%,#CD8841 100%)"></div>
    <div style="position:absolute;right:3cqh;bottom:14.5cqh;width:6cqh;height:13cqh;clip-path:polygon(50% 0,58% 8%,66% 26%,76% 52%,86% 78%,92% 100%,8% 100%,14% 78%,24% 52%,34% 26%,42% 8%);background:repeating-linear-gradient(0deg,rgba(38,38,84,0) 0 1.4cqh,rgba(38,38,84,.16) 1.4cqh 1.6cqh),linear-gradient(90deg,#CD8841 0%,#E7DFD2 20%,#F4EFE6 70%,#CD8841 100%)"></div>
    <div style="position:absolute;left:7.5cqh;bottom:14.5cqh;width:15cqh;height:30cqh;clip-path:polygon(50% 0,57% 5%,63% 18%,70% 40%,78% 66%,86% 88%,90% 100%,10% 100%,14% 88%,22% 66%,30% 40%,37% 18%,43% 5%);background:repeating-linear-gradient(0deg,rgba(38,38,84,0) 0 1.6cqh,rgba(38,38,84,.16) 1.6cqh 1.8cqh),linear-gradient(90deg,#CD8841 0%,#F4EFE6 24%,#F4EFE6 52%,#E7DFD2 76%,#CD8841 100%)"></div>
    <div style="position:absolute;left:12.3cqh;bottom:44cqh;width:5.4cqh;height:1.8cqh;border-radius:50%;background:linear-gradient(90deg,#CD8841,#F4EFE6 40%,#E7DFD2)"></div>
    <div style="position:absolute;left:14.2cqh;bottom:45.6cqh;width:1.6cqh;height:2.4cqh;border-radius:50% 50% 40% 40%;background:#CD8841"></div>
    <div style="position:absolute;left:14.9cqh;bottom:47.5cqh;width:2px;height:6.5cqh;background:#E7DFD2"></div>
    <div style="position:absolute;left:15.1cqh;bottom:51.2cqh;width:3.4cqh;height:2.6cqh;clip-path:polygon(0 0,100% 50%,0 100%);background:#CD8841"></div>
    <div style="position:absolute;left:5cqh;bottom:3.5cqh;width:20cqh;height:11cqh;background:repeating-linear-gradient(90deg,rgba(38,38,84,0) 0 2.3cqh,rgba(38,38,84,.14) 2.3cqh 2.5cqh),linear-gradient(90deg,#CD8841 0%,#F4EFE6 22%,#E7DFD2 80%,#CD8841 100%)"></div>
    <div style="position:absolute;left:13.25cqh;bottom:3.5cqh;width:3.5cqh;height:6.5cqh;border-radius:1.75cqh 1.75cqh 0 0;background:radial-gradient(circle at 50% 80%,#F4EFE6 0,#CD8841 45%,#262654 100%)"></div>
    <div style="position:absolute;left:0;bottom:0;width:30cqh;height:3.5cqh;background:linear-gradient(#F4EFE6,#E7DFD2);box-shadow:0 1.5cqh 3cqh rgba(205,136,65,.35)"></div>
  </div>
  <div style="position:absolute;left:0;bottom:0;width:50.5cqw;height:84cqh;transform:translateX(-{{ offset }}cqw)">
    <div style="position:absolute;inset:0;clip-path:polygon(0 100%,0 58%,14% 50%,26% 54%,40% 34%,52% 38%,66% 16%,78% 20%,90% 6%,100% 10%,100% 100%);background:linear-gradient(90deg,#0E0E1F 0%,#262654 70%,#52606B 100%)"></div>
    <div style="position:absolute;inset:0;clip-path:polygon(40% 34%,52% 38%,66% 16%,78% 20%,90% 6%,100% 10%,100% 100%,62% 100%);background:linear-gradient(90deg,rgba(121,138,150,0) 20%,rgba(121,138,150,.32) 100%)"></div>
    <div style="position:absolute;inset:0;clip-path:polygon(90% 6%,100% 10%,100% 100%,95% 100%,97% 60%,93% 30%);background:linear-gradient(90deg,rgba(205,136,65,0),rgba(205,136,65,{{ rim }}))"></div>
    <div style="position:absolute;inset:0;background:repeating-linear-gradient(170deg,rgba(14,14,31,0) 0 3cqh,rgba(14,14,31,.25) 3cqh 3.2cqh);clip-path:polygon(0 100%,0 58%,14% 50%,26% 54%,40% 34%,52% 38%,66% 16%,78% 20%,90% 6%,100% 10%,100% 100%)"></div>
  </div>
  <div style="position:absolute;right:0;bottom:0;width:50.5cqw;height:84cqh;transform:translateX({{ offset }}cqw)">
    <div style="position:absolute;inset:0;clip-path:polygon(100% 100%,100% 58%,86% 50%,74% 54%,60% 34%,48% 38%,34% 16%,22% 20%,10% 6%,0 10%,0 100%);background:linear-gradient(270deg,#0E0E1F 0%,#262654 70%,#52606B 100%)"></div>
    <div style="position:absolute;inset:0;clip-path:polygon(60% 34%,48% 38%,34% 16%,22% 20%,10% 6%,0 10%,0 100%,38% 100%);background:linear-gradient(270deg,rgba(121,138,150,0) 20%,rgba(121,138,150,.26) 100%)"></div>
    <div style="position:absolute;inset:0;clip-path:polygon(10% 6%,0 10%,0 100%,5% 100%,3% 60%,7% 30%);background:linear-gradient(270deg,rgba(205,136,65,0),rgba(205,136,65,{{ rim }}))"></div>
    <div style="position:absolute;inset:0;background:repeating-linear-gradient(10deg,rgba(14,14,31,0) 0 3cqh,rgba(14,14,31,.25) 3cqh 3.2cqh);clip-path:polygon(100% 100%,100% 58%,86% 50%,74% 54%,60% 34%,48% 38%,34% 16%,22% 20%,10% 6%,0 10%,0 100%)"></div>
  </div>
  <sc-if value="{{ showSeam }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;left:50%;bottom:0;height:76cqh;width:2px;margin-left:-1px;background:linear-gradient(rgba(205,136,65,0),#CD8841 30%,#CD8841);box-shadow:0 0 18px 4px rgba(205,136,65,{{ seamGlow }})"></div>
  </sc-if>
  <div style="position:absolute;left:0;right:0;top:0;height:12cqh;background:linear-gradient(#0E0E1F,rgba(14,14,31,0))"></div>
  <div style="position:absolute;left:0;right:0;bottom:0;height:10cqh;background:linear-gradient(rgba(14,14,31,0),#0E0E1F)"></div>
  <sc-if value="{{ showPlate }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;left:0;right:0;bottom:34cqh;height:12cqh;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);-webkit-mask-image:linear-gradient(transparent,#000);mask-image:linear-gradient(transparent,#000)"></div>
    <div style="position:absolute;left:6cqw;right:6cqw;bottom:-4cqh;height:40cqh;background:#262654;box-shadow:0 -1px 0 #798A96,0 -24px 48px rgba(14,14,31,.6);display:flex;gap:3cqw;padding:4cqh 3cqw;box-sizing:border-box">
      <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:1.2cqh">
        <div style="font-family:'IBM Plex Mono',monospace;font-size:clamp(11px,1.1cqw,14px);letter-spacing:.08em;text-transform:uppercase;color:#AFD9EB">Build sequence · 01 / 05</div>
        <div style="font-family:'Libre Caslon Display',serif;font-size:clamp(26px,3.6cqw,56px);line-height:1;color:#F4EFE6">Sketch</div>
      </div>
      <div style="flex:1.4;min-width:0;background:repeating-linear-gradient(135deg,#262654 0 10px,#0E0E1F 10px 11px);display:flex;align-items:flex-end;padding:10px;box-sizing:border-box">
        <div style="font-family:'IBM Plex Mono',monospace;font-size:11px;line-height:1.4;color:#AFD9EB;background:#0E0E1F;padding:4px 6px">Pencil mountain elevations</div>
      </div>
    </div>
  </sc-if>
  <div style="position:absolute;inset:0;background:url(assets/tex/grain-night.png);pointer-events:none"></div>
  <sc-if value="{{ hasCaption }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;left:16px;top:16px;background:#0E0E1F;color:#AFD9EB;padding:6px 10px;font-family:'IBM Plex Mono',monospace;font-size:12px;line-height:1.4;letter-spacing:.04em;border:1px solid #798A96">{{ caption }}</div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:720},&quot;stage&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;1&quot;,&quot;2&quot;,&quot;3&quot;,&quot;4&quot;],&quot;default&quot;:&quot;3&quot;,&quot;tsType&quot;:&quot;'1'|'2'|'3'|'4'&quot;},&quot;caption&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const s = Math.max(1, Math.min(4, Number(this.props.stage ?? 3)));
    const cfg = {
      1: { offset: 0, glow: 0.18, rays: 0, rim: 0.08, temple: 0, seam: 0.5 },
      2: { offset: 7, glow: 0.55, rays: 0.45, rim: 0.25, temple: 0.75, seam: 0.8 },
      3: { offset: 29, glow: 1, rays: 1, rim: 0.38, temple: 1, seam: 0 },
      4: { offset: 33, glow: 0.8, rays: 0.6, rim: 0.3, temple: 1, seam: 0 }
    }[s];
    return {
      offset: cfg.offset, glow: cfg.glow, rays: cfg.rays, rim: cfg.rim,
      templeOpacity: cfg.temple, showSeam: cfg.seam > 0, seamGlow: cfg.seam,
      showPlate: s === 4, hasCaption: !!this.props.caption, caption: this.props.caption
    };
  }
}
</script>
</body>
</html>
